name: Build CM11 CellBroadcastReceiverTests

on:
  workflow_dispatch:

jobs:
  build:
    name: Build CellBroadcastReceiverTests
    runs-on: ubuntu-latest

    container:
      image: andreaji/android:4.4-kitkat
      options: --user root

    steps:
      - name: Check build environment
        run: |
          echo "=== Java ==="
          java -version
          echo
          echo "=== User ==="
          id
          echo
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          echo
          echo "=== HOME ==="
          echo "$HOME"

      - name: Install repo
        run: |
          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          repo --version

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@example.invalid"
          git config --global color.ui false

      - name: Initialize CM11
        run: |
          mkdir -p /workspace/cm11
          cd /workspace/cm11

          repo init \
            --depth=1 \
            --no-repo-verify \
            -u https://github.com/CyanogenMod/android.git \
            -b cm-11.0

      - name: Sync CM11
        run: |
          cd /workspace/cm11

          repo sync \
            -c \
            --force-sync \
            --no-tags \
            --no-clone-bundle \
            -j2

      - name: Verify CellBroadcastReceiver source
        run: |
          cd /workspace/cm11

          echo "Checking CellBroadcastReceiver test files..."

          test -f \
            packages/apps/CellBroadcastReceiver/tests/Android.mk

          test -f \
            packages/apps/CellBroadcastReceiver/tests/testapp/Android.mk

          test -f \
            packages/apps/CellBroadcastReceiver/tests/testapp/src/com/android/cellbroadcastreceiver/tests/SendTestBroadcastActivity.java

          test -f \
            packages/apps/CellBroadcastReceiver/tests/testapp/src/com/android/cellbroadcastreceiver/tests/SendTestMessages.java

          echo "CellBroadcastReceiver test source found."

      - name: Prepare Android build environment
        run: |
          cd /workspace/cm11

          source build/envsetup.sh
          lunch cm_full-eng

      - name: Build CellBroadcastReceiverTests
        run: |
          cd /workspace/cm11

          source build/envsetup.sh
          lunch cm_full-eng

          make -j2 CellBroadcastReceiverTests

      - name: Find generated APK
        run: |
          cd /workspace/cm11

          echo "Searching for APK..."

          find out \
            -type f \
            -name "CellBroadcastReceiverTests.apk" \
            -print

      - name: Verify APK
        run: |
          cd /workspace/cm11

          APK="$(find out -type f -name "CellBroadcastReceiverTests.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: CellBroadcastReceiverTests.apk was not produced."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo
          echo "APK information:"
          ls -lh "$APK"
          file "$APK"

      - name: Prepare artifact
        run: |
          cd /workspace/cm11

          mkdir -p /tmp/artifacts

          APK="$(find out -type f -name "CellBroadcastReceiverTests.apk" | head -n 1)"

          cp "$APK" \
            /tmp/artifacts/CellBroadcastReceiverTests.apk

          echo "Prepared:"
          ls -lh /tmp/artifacts/CellBroadcastReceiverTests.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CellBroadcastReceiverTests
          path: /tmp/artifacts/CellBroadcastReceiverTests.apk
          if-no-files-found: error
          retention-days: 7
