name: Build CM11 CellBroadcastReceiverTests

on:
  workflow_dispatch:

jobs:
  build:
    name: Build CellBroadcastReceiverTests
    runs-on: ubuntu-latest

    container:
      image: andreaji/android:4.4-kitkat
      options: --user root

    steps:
      - name: Check build environment
        run: |
          echo "=== USER ==="
          id
          echo
          echo "=== JAVA ==="
          java -version
          echo
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          echo
          echo "=== PYTHON ==="
          python --version || true
          echo
          echo "=== GIT ==="
          git --version

      - name: Install Python 2 compatible repo
        run: |
          curl -L \
            https://raw.githubusercontent.com/GerritCodeReview/git-repo/v1.12.31/repo \
            -o /usr/local/bin/repo

          chmod +x /usr/local/bin/repo

          echo "=== REPO VERSION ==="
          repo --version

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@example.invalid"
          git config --global color.ui false

      - name: Create CM11 workspace
        run: |
          mkdir -p /workspace/cm11
          cd /workspace/cm11
          pwd

      - name: Initialize CM11
        working-directory: /workspace/cm11
        run: |
          repo init \
            --depth=1 \
            --no-repo-verify \
            --repo-url=https://gerrit.googlesource.com/git-repo \
            --repo-rev=v1.12.31 \
            -u https://github.com/CyanogenMod/android.git \
            -b cm-11.0

      - name: Sync CM11 source
        working-directory: /workspace/cm11
        run: |
          repo sync \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Verify CellBroadcastReceiver source
        working-directory: /workspace/cm11
        run: |
          echo "=== Checking CellBroadcastReceiver ==="

          test -f \
            packages/apps/CellBroadcastReceiver/tests/Android.mk

          test -f \
            packages/apps/CellBroadcastReceiver/tests/testapp/Android.mk

          test -f \
            packages/apps/CellBroadcastReceiver/tests/testapp/src/com/android/cellbroadcastreceiver/tests/SendTestBroadcastActivity.java

          test -f \
            packages/apps/CellBroadcastReceiver/tests/testapp/src/com/android/cellbroadcastreceiver/tests/SendTestMessages.java

          echo
          echo "CellBroadcastReceiver test source is present."

      - name: Initialize Android build environment
        working-directory: /workspace/cm11
        run: |
          source build/envsetup.sh
          lunch cm_full-eng

      - name: Build CellBroadcastReceiverTests
        working-directory: /workspace/cm11
        run: |
          source build/envsetup.sh
          lunch cm_full-eng
          make -j2 CellBroadcastReceiverTests

      - name: Find CellBroadcastReceiverTests.apk
        working-directory: /workspace/cm11
        run: |
          echo "=== Searching for generated APK ==="

          APK="$(find out \
            -type f \
            -name "CellBroadcastReceiverTests.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: CellBroadcastReceiverTests.apk was not generated."
            echo
            echo "APK search results:"
            find out \
              -type f \
              -iname "*CellBroadcast*" \
              -print || true
            exit 1
          fi

          echo
          echo "APK FOUND:"
          echo "$APK"

          echo
          echo "APK DETAILS:"
          ls -lh "$APK"
          file "$APK"

      - name: Prepare APK artifact
        working-directory: /workspace/cm11
        run: |
          mkdir -p /workspace/artifacts

          APK="$(find out \
            -type f \
            -name "CellBroadcastReceiverTests.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK disappeared before artifact preparation."
            exit 1
          fi

          cp "$APK" \
            /workspace/artifacts/CellBroadcastReceiverTests.apk

          echo "=== ARTIFACT ==="
          ls -lh \
            /workspace/artifacts/CellBroadcastReceiverTests.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CellBroadcastReceiverTests
          path: /workspace/artifacts/CellBroadcastReceiverTests.apk
          if-no-files-found: error
          retention-days: 7
